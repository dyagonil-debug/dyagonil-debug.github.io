<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-topologies-wyrm_fang_maw" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-topologies-wyrm_fang_maw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="glow-topologies-wyrm_fang_maw" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#34d399" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-topologies-wyrm_fang_maw)" stroke="#10b981" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#34d399" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#10b981" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#10b981" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#10b981" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#10b981" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-topologies-wyrm_fang_maw)">
    <polygon points="12,16 52,16 52,48 12,48" fill="none" stroke="#6ee7b7" stroke-width="1.8"/><polygon points="14,16 22,36 28,16 36,16 42,36 50,16" fill="url(#grad-topologies-wyrm_fang_maw)" stroke="#ecfdf5" stroke-width="1.8" stroke-linejoin="round"/><polygon points="20,48 26,32 32,48 38,32 44,48" fill="url(#grad-topologies-wyrm_fang_maw)" stroke="#fde047" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
