<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-wheel-ai_headstart" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-wheel-ai_headstart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
        <filter id="glow-wheel-ai_headstart" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#fb923c" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-wheel-ai_headstart)" stroke="#fdba74" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#fb923c" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#fdba74" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#fdba74" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#fdba74" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#fdba74" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-wheel-ai_headstart)">
    
            <rect x="18" y="20" width="28" height="24" rx="5" fill="url(#grad-wheel-ai_headstart)" stroke="#ffedd5" stroke-width="2"/>
            <line x1="32" y1="12" x2="32" y2="20" stroke="#2dd4bf" stroke-width="2.5"/>
            <circle cx="26" cy="30" r="3" fill="#2dd4bf"/>
            <circle cx="38" cy="30" r="3" fill="#2dd4bf"/>
            <line x1="24" y1="38" x2="40" y2="38" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
</svg>