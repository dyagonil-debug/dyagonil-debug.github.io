  <circle cx="53" cy="11" r="1.3" fill="#84cc16" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#84cc16" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#84cc16" opacity="0.7"/>
