<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-gambits-coaster_apex" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-gambits-coaster_apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
        <filter id="glow-gambits-coaster_apex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#2dd4bf" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-gambits-coaster_apex)" stroke="#38bdf8" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-gambits-coaster_apex)">
    
            <path d="M12 46 Q32 10 52 46" stroke="url(#grad-gambits-coaster_apex)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <line x1="22" y1="31" x2="22" y2="48" stroke="#64748b" stroke-width="2"/>
            <line x1="32" y1="24" x2="32" y2="48" stroke="#64748b" stroke-width="2"/>
            <line x1="42" y1="31" x2="42" y2="48" stroke="#64748b" stroke-width="2"/>
            <rect x="25" y="15" width="14" height="8" rx="3" fill="#fbbf24" stroke="#fef3c7" stroke-width="1.5"/>
        
  </g>
</svg>