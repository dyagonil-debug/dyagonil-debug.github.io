<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-gambits-obsidian_cat" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-gambits-obsidian_cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#1e1b24"/>
    </linearGradient>
        <filter id="glow-gambits-obsidian_cat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-gambits-obsidian_cat)" stroke="#fbbf24" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#fbbf24" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-gambits-obsidian_cat)">
    
            <polygon points="18,28 18,14 27,22 37,22 46,14 46,28 43,45 21,45" fill="url(#grad-gambits-obsidian_cat)" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
            <polygon points="23,31 29,31 26,35" fill="#fde047"/>
            <polygon points="35,31 41,31 38,35" fill="#fde047"/>
            <polygon points="30,38 34,38 32,41" fill="#f43f5e"/>
        
  </g>
</svg>