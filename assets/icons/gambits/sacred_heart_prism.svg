  <circle cx="53" cy="11" r="1.3" fill="#fde047" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#fde047" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#fde047" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-gambits-sacred_heart_prism)">
    
            <path d="M32 49 C32 49, 14 37, 14 24 C14 17, 20 14, 26 16 C29 17, 31 20, 32 22 C33 20, 35 17, 38 16 C44 14, 50 17, 50 24 C50 37, 32 49, 32 49 Z" fill="url(#grad-gambits-sacred_heart_prism)" stroke="#fef08a" stroke-width="2" stroke-linejoin="round"/>
