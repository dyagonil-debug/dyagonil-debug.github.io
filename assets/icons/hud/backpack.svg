<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-hud-backpack-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="grad-hud-backpack-flap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="grad-hud-backpack-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="grad-hud-backpack-gem" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
  </defs>
  <!-- Top Reinforced Brass Handle -->
  <path d="M23 14 C23 6, 41 6, 41 14" fill="none" stroke="#1c1917" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M23 14 C23 6, 41 6, 41 14" fill="none" stroke="url(#grad-hud-backpack-gold)" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Bedroll / Subterranean Rope Coils on Top -->
  <rect x="16" y="11" width="32" height="7" rx="3.5" fill="#292524" stroke="#fbbf24" stroke-width="1.8"/>
  <path d="M23 11 V18 M32 11 V18 M41 11 V18" stroke="#f59e0b" stroke-width="1.8"/>
  <!-- Side Lantern / Crystal Pouches -->
  <rect x="5" y="28" width="9" height="21" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <path d="M7 33 H12" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="50" y="28" width="9" height="21" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <path d="M52 33 H57" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Main Leather Pack Chassis -->
  <rect x="12" y="15" width="40" height="42" rx="10" fill="url(#grad-hud-backpack-body)" stroke="#fde68a" stroke-width="2.4"/>
  <!-- Inner Corner Rivets & Shading -->
  <path d="M16 49 C16 53, 48 53, 48 49" fill="none" stroke="#1c1917" stroke-width="2.5" opacity="0.55"/>
  <!-- Top Storm Flap -->
  <path d="M12 23 C12 15, 52 15, 52 23 L49 33 C48 36, 16 36, 15 33 Z" fill="url(#grad-hud-backpack-flap)" stroke="#fde68a" stroke-width="2"/>
  <path d="M17 20 C24 17, 40 17, 47 20" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
  <!-- Lower Relic Pocket -->
  <rect x="18" y="37" width="28" height="15" rx="5" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
  <rect x="20" y="39" width="24" height="11" rx="3.5" fill="#292524"/>
  <!-- Leather Twin Straps -->
  <rect x="20" y="16" width="5" height="22" rx="2" fill="#78350f" stroke="#fbbf24" stroke-width="1.4"/>
  <rect x="39" y="16" width="5" height="22" rx="2" fill="#78350f" stroke="#fbbf24" stroke-width="1.4"/>
  <!-- Center Arcane Clasp & Teal Relic Gem -->
  <polygon points="32,25 39,32 32,39 25,32" fill="url(#grad-hud-backpack-gold)" stroke="#1c1917" stroke-width="1.8"/>
  <polygon points="32,27.5 36.5,32 32,36.5 27.5,32" fill="url(#grad-hud-backpack-gem)"/>
</svg>
