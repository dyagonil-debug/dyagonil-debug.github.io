<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-hud-music-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-hud-music-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background 8-Bit Chiptune Wave Bars -->
  <rect x="8" y="28" width="3" height="12" rx="1.5" fill="#2dd4bf" opacity="0.4"/>
  <rect x="13" y="22" width="3" height="20" rx="1.5" fill="#fbbf24" opacity="0.35"/>
  <rect x="54" y="24" width="3" height="16" rx="1.5" fill="#2dd4bf" opacity="0.4"/>
  <!-- Note Stems & Double Chiptune Crossbeam -->
  <path d="M23 46 V15 L51 9 V40" fill="none" stroke="#1c1917" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23 15 L51 9 L51 18 L23 24 Z" fill="url(#grad-hud-music-beam)" stroke="#fef08a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M23 46 V15 M51 40 V9" stroke="url(#grad-hud-music-beam)" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Left & Right Crystalline Note Heads -->
  <ellipse cx="17" cy="47" rx="8.5" ry="6.2" transform="rotate(-16 17 47)" fill="url(#grad-hud-music-beam)" stroke="#fef08a" stroke-width="2"/>
  <ellipse cx="45" cy="41" rx="8.5" ry="6.2" transform="rotate(-16 45 41)" fill="url(#grad-hud-music-teal)" stroke="#ccfbf1" stroke-width="2"/>
</svg>
