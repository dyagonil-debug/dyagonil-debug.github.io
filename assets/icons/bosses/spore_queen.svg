    <linearGradient id="grad-bosses-spore_queen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
        <filter id="glow-bosses-spore_queen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#84cc16" flood-opacity="0.45" result="offsetColor"/>
