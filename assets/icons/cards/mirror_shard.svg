<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-cards-mirror_shard" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e" />
      <stop offset="70%" stop-color="#110e17" />
      <stop offset="100%" stop-color="#070609" />
    </radialGradient>
    <linearGradient id="grad-cards-mirror_shard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <filter id="glow-cards-mirror_shard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur" />
      <feFlood flood-color="#38bdf8" flood-opacity="0.45" result="offsetColor" />
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow" />
      <feMerge>
        <feMergeNode in="offsetGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-cards-mirror_shard)" stroke="#f0abfc" stroke-width="2.2" />
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" />
  <circle cx="11" cy="11" r="1.3" fill="#f0abfc" opacity="0.7" />
  <circle cx="53" cy="11" r="1.3" fill="#f0abfc" opacity="0.7" />
  <circle cx="11" cy="53" r="1.3" fill="#f0abfc" opacity="0.7" />
  <circle cx="53" cy="53" r="1.3" fill="#f0abfc" opacity="0.7" />
  <g filter="url(#glow-cards-mirror_shard)">
    <polygon points="27,11 47,19 39,51 17,43" fill="url(#grad-cards-mirror_shard)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <line x1="23" y1="39" x2="41" y2="21" stroke="#fef08a" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="27" cy="40" r="4.2" fill="#fbbf24" stroke="#fef3c7" stroke-width="1.3" />
    <polygon points="35,17 41,23 35,29 29,23" fill="#fef08a" stroke="#ffffff" stroke-width="1.3" />
