<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-cards-abyssal_upheaval" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-cards-abyssal_upheaval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
        <filter id="glow-cards-abyssal_upheaval" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#c084fc" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-cards-abyssal_upheaval)" stroke="#a855f7" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#c084fc" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#a855f7" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#a855f7" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#a855f7" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#a855f7" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-cards-abyssal_upheaval)">
    
            <rect x="20" y="20" width="24" height="24" rx="4" fill="#1e1b24" stroke="url(#grad-cards-abyssal_upheaval)" stroke-width="2.2" transform="rotate(15 32 32)"/>
            <path d="M14 28 A18 18 0 0 1 48 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <polygon points="49,17 51,25 43,24" fill="#38bdf8"/>
            <path d="M50 36 A18 18 0 0 1 16 42" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <polygon points="15,47 13,39 21,40" fill="#fbbf24"/>
        
  </g>
</svg>