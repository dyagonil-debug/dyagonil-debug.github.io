<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-cards-inversion" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-cards-inversion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
        <filter id="glow-cards-inversion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#2dd4bf" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-cards-inversion)" stroke="#38bdf8" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#38bdf8" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-cards-inversion)">
    
            <path d="M22 44 V20 L16 26 M42 20 V44 L48 38" stroke="url(#grad-cards-inversion)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="32" cy="32" rx="16" ry="7" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
            <circle cx="32" cy="24" r="3.5" fill="#fbbf24"/>
            <circle cx="32" cy="40" r="3.5" fill="#2dd4bf"/>
        
  </g>
