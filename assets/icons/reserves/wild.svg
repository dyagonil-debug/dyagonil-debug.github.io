<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-reserves-wild" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-reserves-wild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
        <filter id="glow-reserves-wild" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#e879f9" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-reserves-wild)" stroke="#f0abfc" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#e879f9" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#f0abfc" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#f0abfc" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#f0abfc" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#f0abfc" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-reserves-wild)">
    
            <polygon points="32,11 49,26 42,49 22,49 15,26" fill="url(#grad-reserves-wild)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
            <polygon points="32,19 41,28 37,42 27,42 23,28" fill="#fef08a" fill-opacity="0.35" stroke="#ffffff" stroke-width="1.2"/>
            <circle cx="32" cy="32" r="4" fill="#ffffff"/>
        
  </g>
</svg>