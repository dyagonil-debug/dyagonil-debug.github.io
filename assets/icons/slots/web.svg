<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bg-slots-web" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#231c2e"/>
      <stop offset="70%" stop-color="#110e17"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <linearGradient id="grad-slots-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
        <filter id="glow-slots-web" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.45" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subterranean Carved Obsidian Medallion Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-slots-web)" stroke="#c084fc" stroke-width="2.2"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="10.5" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Corner Brass Rivets -->
  <circle cx="11" cy="11" r="1.3" fill="#c084fc" opacity="0.7"/>
  <circle cx="53" cy="11" r="1.3" fill="#c084fc" opacity="0.7"/>
  <circle cx="11" cy="53" r="1.3" fill="#c084fc" opacity="0.7"/>
  <circle cx="53" cy="53" r="1.3" fill="#c084fc" opacity="0.7"/>
  <!-- Foreground Emblem -->
  <g filter="url(#glow-slots-web)">
    
            <circle cx="32" cy="32" r="16" stroke="url(#grad-slots-web)" stroke-width="4" fill="none"/>
            <line x1="16" y1="32" x2="48" y2="32" stroke="#e9d5ff" stroke-width="1.6"/>
            <line x1="32" y1="16" x2="32" y2="48" stroke="#e9d5ff" stroke-width="1.6"/>
            <line x1="21" y1="21" x2="43" y2="43" stroke="#e9d5ff" stroke-width="1.6"/>
            <line x1="43" y1="21" x2="21" y2="43" stroke="#e9d5ff" stroke-width="1.6"/>
            <circle cx="32" cy="32" r="7" stroke="#e9d5ff" stroke-width="1.5" fill="none"/>
        
  </g>
</svg>